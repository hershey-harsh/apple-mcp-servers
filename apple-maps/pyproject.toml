[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apple-maps-mcp"
version = "0.1.0"
description = "Local Apple Maps MCP server for macOS"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Harsh", email = "social@mannava.org" },
]
dependencies = [
  "mcp>=1.26.0,<2",
  "pydantic>=2.12.0",
]

[project.scripts]
apple-maps-mcp = "apple_maps_mcp.tools:main"

[project.urls]
Homepage = "https://github.com/hershey-harsh/apple-mcp-servers"
Repository = "https://github.com/hershey-harsh/apple-mcp-servers"
Issues = "https://github.com/hershey-harsh/apple-mcp-servers/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
apple_maps_mcp = ["*.swift"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
